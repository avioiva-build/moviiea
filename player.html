<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moviiea Player</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #err{color:#eee;font-family:sans-serif;display:none;padding:2.5em;text-align:center;line-height:1.6}
</style>
</head>
<body>
<iframe id="f" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
<script>
  (function () {
    var p = new URLSearchParams(location.search).get('u') || '';
    var ok = /^https:\/\/(vidapi\.xyz|vidsrc\.xyz|(www\.)?2embed\.cc)\//i.test(p);
    var f = document.getElementById('f');
    if (ok) {
      f.src = p;
    } else {
      document.body.innerHTML = '<div id="err" style="display:block">Player link missing or invalid.<br>Open the movie again from the Moviiea app.</div>';
    }
  })();
</script>
</body>
</html>
